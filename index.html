
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vox Domini</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f4f5f7;
  color: #202b38;
}

header {
  background: #183653;
  color: white;
  padding: 28px 18px;
  text-align: center;
}

header h1 {
  margin: 0;
  font-size: 30px;
}

header p {
  margin-bottom: 0;
  color: #dce8f2;
}

main {
  max-width: 850px;
  margin: auto;
  padding: 18px;
}

h2 { color: #183653; }

input {
  width: 100%;
  padding: 14px;
  border: 1px solid #ccd3dc;
  border-radius: 9px;
  font-size: 16px;
  margin: 8px 0 18px;
}

button {
  padding: 12px 15px;
  border: 0;
  border-radius: 8px;
  background: #244d70;
  color: white;
  font-size: 15px;
  cursor: pointer;
}

button:active { opacity: .8; }

.categories {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(135px, 1fr));
  gap: 10px;
}

.category {
  background: white;
  color: #183653;
  border: 1px solid #dce2e8;
  text-align: left;
  min-height: 52px;
}

.category.selected {
  background: #183653;
  color: white;
}

.song {
  background: white;
  padding: 16px;
  border-radius: 10px;
  margin: 12px 0;
  border: 1px solid #e0e5eb;
}

.song h3 {
  margin-top: 0;
  color: #183653;
}

.lyrics {
  white-space: pre-wrap;
  line-height: 1.7;
}

.status {
  padding: 12px;
  border-radius: 8px;
  background: #e9eef3;
  margin: 12px 0;
}

footer {
  text-align: center;
  padding: 25px;
  color: #667;
}
</style>
</head>

<body>

<header>
  <h1>♫ VOX DOMINI</h1>
  <p>Cantoral litúrgico</p>
</header>

<main>

  <h2>Buscar cantos</h2>

  <input
    id="search"
    type="search"
    placeholder="Buscar por título o letra..."
  >

  <h2>Categorías</h2>

  <div id="categoryBox" class="categories">
    <p>Cargando categorías...</p>
  </div>

  <div id="status" class="status">
    Conectando con Vox Domini...
  </div>

  <h2>Cantos</h2>

  <div id="songs">
    Selecciona una categoría o realiza una búsqueda.
  </div>

</main>

<footer>
  © 2026 Vox Domini
</footer>

<script>
const SUPABASE_URL =
  "https://ndwfbmmhffhwrlnzhzip.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_LoA4FVqzyNvqUo2JkXo63A_xuWomF6k";

const db = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

const categoryBox = document.getElementById("categoryBox");
const songsBox = document.getElementById("songs");
const statusBox = document.getElementById("status");
const searchBox = document.getElementById("search");

let selectedCategory = null;
let categories = [];

function element(tag, content, className) {
  const node = document.createElement(tag);
  node.textContent = content;
  if (className) node.className = className;
  return node;
}

async function loadCategories() {
  categoryBox.replaceChildren(
    element("p", "Cargando categorías...")
  );

  const { data, error } = await db
    .from("Categorias")
    .select('id, "Categorias", categorias')
    .order("id");

  if (error) {
    categoryBox.replaceChildren();
    statusBox.textContent =
      "Error al cargar categorías: " + error.message;
    return;
  }

  const unique = new Map();

  data.forEach(row => {
    const name = row.categorias || row.Categorias;

    if (name) {
      const normalized = String(name).trim();

      if (normalized) {
        unique.set(normalized.toLowerCase(), {
          id: row.id,
          name: normalized
        });
      }
    }
  });

  categories = [...unique.values()];
  categoryBox.replaceChildren();

  if (!categories.length) {
    categoryBox.append(
      element("p", "No hay categorías registradas.")
    );
    return;
  }

  categories.forEach(cat => {
    const button = element(
      "button",
      "♫ " + cat.name,
      "category"
    );

    button.onclick = () => {
      selectedCategory = cat;
      document.querySelectorAll(".category")
        .forEach(b => b.classList.remove("selected"));

      button.classList.add("selected");
      loadSongs();
    };

    categoryBox.append(button);
  });

  statusBox.textContent =
    categories.length + " categorías disponibles.";
}

async function loadSongs() {
  songsBox.replaceChildren(
    element("p", "Buscando cantos...")
  );

  let query = db
    .from("Cantos")
    .select("*")
    .eq("publicado", true)
    .order("titulo");

  if (selectedCategory) {
    query = query.eq("categoria", selectedCategory.name);
  }

  const term = searchBox.value.trim();

  if (term) {
    query = query.or(
      "titulo.ilike.%" + term +
      "%,letra.ilike.%" + term + "%"
    );
  }

  const { data, error } = await query;

  songsBox.replaceChildren();

  if (error) {
    songsBox.append(
      element("p", "Error al cargar cantos: " + error.message)
    );
    return;
  }

  if (!data || data.length === 0) {
    songsBox.append(
      element("p", "No se encontraron cantos.")
    );
    return;
  }

  data.forEach(song => {
    const card = document.createElement("article");
    card.className = "song";

    card.append(
      element("h3", song.titulo || "Sin título")
    );

    if (song.tono) {
      card.append(element("p", "Tono: " + song.tono));
    }

    if (song.autor) {
      card.append(element("p", "Autor: " + song.autor));
    }

    card.append(
      element("div", song.letra || "", "lyrics")
    );

    songsBox.append(card);
  });
}

searchBox.addEventListener("input", () => {
  loadSongs();
});

async function start() {
  try {
    if (
      SUPABASE_KEY === "PEGA_AQUI_TU_CLAVE_PUBLISHABLE"
    ) {
      statusBox.textContent =
        "Falta colocar la clave Publishable de Supabase.";
      categoryBox.replaceChildren();
      return;
    }

    await loadCategories();

  } catch (error) {
    statusBox.textContent =
      "Error de conexión: " + error.message;
  }
}

start();
</script>

</body>
  </html>
