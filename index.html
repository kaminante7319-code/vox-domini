
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#172d49">
<title>Vox Domini | Cantoral Litúrgico</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f5f6f8;
  color: #263449;
}

header {
  background: #172d49;
  color: white;
  text-align: center;
  padding: 35px 15px;
}

.logo {
  font-size: 38px;
  color: #e5c77a;
  margin-bottom: 8px;
}

header h1 {
  margin: 0;
  letter-spacing: 4px;
  font-size: 29px;
}

header p {
  color: #e5c77a;
  margin-bottom: 0;
}

main {
  max-width: 950px;
  margin: auto;
  padding: 25px 16px;
}

h2 {
  color: #172d49;
  text-align: center;
}

.search {
  width: 100%;
  padding: 15px;
  border: 1px solid #d5dce5;
  border-radius: 12px;
  font-size: 16px;
  margin: 15px 0 25px;
}

.categories {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
}

.category {
  background: white;
  border: 1px solid #e0e4e9;
  border-radius: 12px;
  padding: 18px 12px;
  text-align: left;
  cursor: pointer;
  color: #263449;
  font-size: 14px;
  min-height: 65px;
  transition: .2s;
}

.category:hover,
.category.active {
  background: #172d49;
  color: white;
  border-color: #172d49;
}

.category span {
  color: #b18a43;
  margin-right: 7px;
}

#message {
  background: white;
  border-radius: 12px;
  padding: 22px;
  margin-top: 25px;
  text-align: center;
  display: none;
}

footer {
  background: #172d49;
  color: white;
  text-align: center;
  padding: 25px;
  margin-top: 35px;
  font-size: 13px;
}

@media (min-width: 650px) {
  .categories {
    grid-template-columns: repeat(3, 1fr);
  }
}
</style>
</head>

<body>

<header>
  <div class="logo">♫</div>
  <h1>VOX DOMINI</h1>
  <p>Cantoral Litúrgico</p>
  <small>La música al servicio de la liturgia</small>
</header>

<main>

  <h2>Bienvenidos a Vox Domini</h2>

  <input
    class="search"
    type="search"
    id="search"
    placeholder="Buscar una categoría litúrgica..."
    oninput="filterCategories()"
  >

  <h2>Categorías litúrgicas</h2>

  <div class="categories" id="categories"></div>

  <div id="message">
    <h3 id="selected"></h3>
    <p>Estamos preparando nuestro repertorio musical.</p>
    <p>Próximamente encontrarás aquí los cantos publicados.</p>
  </div>

</main>

<footer>
  <strong>VOX DOMINI</strong>
  <p>Cantoral Litúrgico Católico</p>
  <p>© 2026 Vox Domini</p>
</footer>

<script>
const categories = [
  "Entrada",
  "Señor, ten piedad",
  "Gloria",
  "Salmo responsorial",
  "Aleluya",
  "Ofertorio",
  "Santo",
  "Aclamación después de la consagración",
  "Amén",
  "Padre nuestro",
  "Cordero de Dios",
  "Comunión",
  "Salida",
  "Adoración eucarística",
  "Marianos"
];

const container = document.getElementById("categories");

function showCategories(list) {
  container.innerHTML = "";

  list.forEach(name => {
    const button = document.createElement("button");
    button.className = "category";
    button.innerHTML = '<span>♫</span>';
    button.appendChild(document.createTextNode(name));

    button.onclick = () => {
      document.getElementById("selected").textContent = name;
      document.getElementById("message").style.display = "block";
      document.querySelectorAll(".category").forEach(b =>
        b.classList.remove("active")
      );
      button.classList.add("active");
    };

    container.appendChild(button);
  });
}

function filterCategories() {
  const value = document.getElementById("search")
    .value.toLowerCase();

  const filtered = categories.filter(name =>
    name.toLowerCase().includes(value)
  );

  showCategories(filtered);
}

showCategories(categories);
</script>

</body>
</html>
